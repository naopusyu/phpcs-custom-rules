name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: dom, libxml, mbstring, simplexml, tokenizer, xml, xmlwriter
          coverage: none
      - run: composer validate --strict
      - run: composer update --prefer-dist --no-interaction --no-progress
      - run: composer test
      - name: Verify the ruleset loads all four sniffs
        run: |
          sniffs=$(vendor/bin/phpcs -e --standard=src/PHPCSCustomRules/ruleset.xml)
          printf '%s\n' "$sniffs"
          grep -Fxq 'The PHPCSCustomRules standard contains 4 sniffs' <<< "$sniffs"
